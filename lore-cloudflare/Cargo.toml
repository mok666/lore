[package]
name = "lore-cloudflare"
edition = "2024"
version.workspace = true
publish = false

[dependencies]
async-trait = { workspace = true }
bytes = { workspace = true }
chrono = { workspace = true }
libsql = { version = "0.9.30", default-features = false, features = [
    "remote",
    "tls",
] }
lore-base = { workspace = true }
lore-error-set = { workspace = true }
lore-macro = { workspace = true }
lore-revision = { workspace = true }
lore-storage = { workspace = true }
serde = { workspace = true, features = ["derive"] }
tokio = { workspace = true }
toml = { workspace = true }
tracing = { workspace = true }

[dev-dependencies]
futures = { workspace = true }
rand = { workspace = true }

[features]
default = []
