# SPDX-License-Identifier: MIT

name: Build cloudflare loreserver image

# Builds loreserver from the source of a cf-v<release>-<n> tag and publishes it
# to ghcr.io/<owner>/<repo>/lore-server:<tag>. linux/amd64 only. No storage or database
# credentials are passed to this workflow; it uses only GITHUB_TOKEN.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Source tag, for example "cf-v0.10.1-1". It is also the image tag and is never overwritten.'
        type: string
        required: true

permissions: {}

concurrency:
  group: cloudflare-image-${{ inputs.tag }}
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/${{ github.repository }}/lore-server

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      TAG: ${{ inputs.tag }}
    steps:
      - name: Validate the tag name
        run: |
          set -euo pipefail
          if ! printf '%s' "${TAG}" | grep -qE '^cf-v[0-9]+\.[0-9]+\.[0-9]+-[0-9]+$'; then
            echo "::error::'${TAG}' is not of the form cf-v1.2.3-1"
            exit 1
          fi

      # The workflow ref supplies the Dockerfile; the tag supplies the source.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Refuse to overwrite a published tag
        run: |
          set -euo pipefail
          if docker buildx imagetools inspect "${IMAGE}:${TAG}" > /dev/null 2>&1; then
            echo "::error::${IMAGE}:${TAG} already exists; publish a new -<n> tag instead"
            exit 1
          fi

      - id: source
        name: Verify the tag and unpack its source into a separate build context
        run: |
          set -euo pipefail
          if ! git rev-parse -q --verify "refs/tags/${TAG}^{commit}" > /dev/null; then
            echo "::error::tag ${TAG} does not exist in this repository"
            exit 1
          fi
          revision="$(git rev-parse "refs/tags/${TAG}^{commit}")"
          for f in Cargo.lock lore-server/Cargo.toml lore-server/config/default.toml LICENSE; do
            git cat-file -e "${revision}:${f}" || { echo "::error::${f} missing at ${TAG}"; exit 1; }
          done
          context="${RUNNER_TEMP}/context"
          mkdir -p "${context}"
          git archive "${revision}" | tar -x -C "${context}"
          echo "revision=${revision}" >> "$GITHUB_OUTPUT"
          echo "context=${context}" >> "$GITHUB_OUTPUT"
          echo "Cargo.lock sha256=$(sha256sum "${context}/Cargo.lock" | cut -d' ' -f1)"

      - id: build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: ${{ steps.source.outputs.context }}
          file: contrib/cloudflare/Dockerfile
          platforms: linux/amd64
          provenance: false
          load: true
          build-args: |
            SOURCE_REVISION=${{ steps.source.outputs.revision }}
          tags: ${{ env.IMAGE }}:${{ inputs.tag }}

      - name: ldd and startup check
        env:
          REVISION: ${{ steps.source.outputs.revision }}
        run: |
          set -euo pipefail
          ref="${IMAGE}:${TAG}"
          out="$(docker run --rm --entrypoint ldd "${ref}" /usr/local/bin/loreserver)"
          echo "${out}"
          if grep -q "not found" <<< "${out}"; then
            echo "::error::unresolved shared library"
            exit 1
          fi
          docker run --rm "${ref}" --version
          label="$(docker image inspect "${ref}" --format '{{index .Config.Labels "org.opencontainers.image.revision"}}')"
          [ "${label}" = "${REVISION}" ]
          # Start with local stores and wait for the HTTP health check.
          mkdir -p "${RUNNER_TEMP}/cfg"
          printf '[immutable_store.local]\npath = "/data"\n\n[mutable_store.local]\npath = "/data"\n' \
            > "${RUNNER_TEMP}/cfg/docker.toml"
          docker run -d --name lore-smoke -e LORE_ENV=docker \
            -v "${RUNNER_TEMP}/cfg/docker.toml:/etc/lore/config/docker.toml:ro" \
            -p 41339:41339 "${ref}"
          ok=0
          for _ in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:41339/health_check > /dev/null; then ok=1; break; fi
            sleep 2
          done
          docker logs lore-smoke | tail -n 20
          docker rm -f lore-smoke > /dev/null
          [ "${ok}" = 1 ] || { echo "::error::health check did not pass"; exit 1; }

      # Checked again at push time: another run may have published meanwhile.
      - id: push
        name: Push without overwriting
        run: |
          set -euo pipefail
          ref="${IMAGE}:${TAG}"
          if docker buildx imagetools inspect "${ref}" > /dev/null 2>&1; then
            echo "::error::${ref} already exists"
            exit 1
          fi
          docker push "${ref}"
          digest="$(docker buildx imagetools inspect "${ref}" --format '{{json .Manifest}}' | jq -r .digest)"
          echo "digest=${digest}" >> "$GITHUB_OUTPUT"

      - name: Summary
        env:
          DIGEST: ${{ steps.push.outputs.digest }}
          REVISION: ${{ steps.source.outputs.revision }}
        run: |
          {
            echo "## Published \`${IMAGE}:${TAG}\`"
            echo ""
            echo "- Image digest: \`${DIGEST}\`"
            echo "- Source revision (OCI label): \`${REVISION}\`"
            echo "- Workflow commit: \`${GITHUB_SHA}\`"
            echo "- Platform: linux/amd64"
          } >> "$GITHUB_STEP_SUMMARY"
